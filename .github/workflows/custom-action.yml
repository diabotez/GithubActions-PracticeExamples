name: "Test Custom Action"

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run custom action
        id: hello
        uses: diabotez/barum@v0.1.1
        with:
          who-to-greet: Dalwar

      - name: Display output
        run: echo "Greeting time was ${{ steps.hello.outputs.time }}"