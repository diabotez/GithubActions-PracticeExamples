name: "Test Custom Action"

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      name:
        description: 'Name of the person to greet'
        required: false
        default: ${{ env.WHO_TO_GREET }}
        type: string

env:
  WHO_TO_GREET: Dalwar

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run custom action
        id: hello
        uses: diabotez/barum@v0.1.1
        with:
          who-to-greet: ${{ inputs.name }}

      - name: Display output
        run: echo "${{inputs.name}}'s greeting time was ${{ steps.hello.outputs.time }}"